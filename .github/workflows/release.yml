name: release

# Build downloadable binaries for every platform and attach them to a GitHub
# Release. Triggers on a pushed `v*` tag (e.g. `git tag v0.6.8 && git push
# --tags`) or manually via the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Windows: portable .zip -------------------------------------------
  windows:
    runs-on: windows-latest
    # Mapped to env so the signing step can test for their presence — `secrets`
    # is not available in a step-level `if`. Empty when unconfigured, which is
    # exactly how the signing step decides to skip itself.
    env:
      SIGN_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SIGN_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      SIGN_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGN_ENDPOINT: ${{ vars.SIGN_ENDPOINT }}
      SIGN_ACCOUNT: ${{ vars.SIGN_ACCOUNT }}
      SIGN_CERT_PROFILE: ${{ vars.SIGN_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@30b5ca8b54e1dcffd9548bc87ede1531310fdc67 # v1.20.0
      - name: Install dioxus-cli
        # --force: the rust-cache can restore a "dx already installed" marker
        # without a usable binary, which then isn't found below. Forcing the
        # install guarantees dx.exe is actually present.
        run: cargo binstall dioxus-cli@0.7.9 -y --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add cargo bin to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
      - name: Build CSS
        run: |
          npm install
          npx @tailwindcss/cli -i ./tailwind.css -o ./crates/kopuz/assets/tailwind.css
      # Plain build first — this is the part that must always succeed. It
      # produces a runnable app dir we zip as a guaranteed portable download.
      - name: Build app
        run: dx build --release --platform desktop --package kopuz
      # Sign BEFORE zipping, so the archive carries the signed binary — that is
      # the file the in-app updater installs and the one antivirus judges.
      #
      # Why this exists: Defender's ML heuristic quarantines the CI-built
      # kopuz.exe as Trojan:Win32/Wacatac.B!ml, the documented generic false
      # positive for unsigned Rust binaries (rust-lang/rust#88297). Locally
      # built binaries pass; the released one does not, which made every release
      # unusable on Windows. A signature is what earns the reputation that stops
      # it — no code change can.
      #
      # Skips itself until the credentials exist, so releases keep working
      # unsigned in the meantime. Set the three secrets (AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET) and the three repository variables
      # (SIGN_ENDPOINT, SIGN_ACCOUNT, SIGN_CERT_PROFILE) to switch it on.
      - name: Sign the binary
        if: env.SIGN_CLIENT_ID != '' && env.SIGN_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ env.SIGN_TENANT_ID }}
          azure-client-id: ${{ env.SIGN_CLIENT_ID }}
          azure-client-secret: ${{ env.SIGN_CLIENT_SECRET }}
          endpoint: ${{ env.SIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ env.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGN_CERT_PROFILE }}
          files-folder: target/dx/kopuz/release/windows/app
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $app = "target/dx/kopuz/release/windows/app"
          if (Test-Path $app) {
            Compress-Archive -Path "$app/*" -DestinationPath dist/Kopuz-windows-portable.zip -Force
          }
      # The NSIS installer is deliberately NOT published any more.
      #
      # Running it over an existing installation cost a user their entire setup:
      # the upgrade runs the previous uninstaller first, and %APPDATA%\temidaradev
      # — config.json with the YouTube session, playlists.json, favorites.json —
      # was gone afterwards. Until that is understood and fixed, shipping the
      # installer means shipping a way to wipe people's libraries.
      #
      # The portable zip is the supported Windows download and the one the
      # in-app updater applies: it only ever replaces files inside the program
      # folder and never touches user data.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false

  # ---- Linux: AppImage ---------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libopus-dev libasound2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev \
            libglib2.0-dev libpango1.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev \
            libfuse2 nodejs npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Build CSS
        run: |
          npm install
          npx @tailwindcss/cli -i ./tailwind.css -o ./crates/kopuz/assets/tailwind.css
      - name: Build binary
        run: dx build --package kopuz --release
      # Guaranteed portable download: tar the runnable app dir. Works even if
      # the AppImage packaging (below) flakes.
      - name: Portable tarball
        run: |
          mkdir -p dist
          app=target/dx/kopuz/release/linux/app
          cp scripts/install-linux.sh "$app/" || true
          tar -czf dist/Kopuz-linux-x86_64.tar.gz -C "$app" .
      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/dx/kopuz/release/linux/app/kopuz AppDir/usr/bin/kopuz
          cp data/com.temidaradev.kopuz.desktop AppDir/usr/share/applications/
          # Icon basename must match the desktop file's Icon= key.
          cp crates/kopuz/assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/com.temidaradev.kopuz.png
      # AppImage is best-effort — appimagetool occasionally exits non-zero on
      # the runner (AppStream/FUSE quirks). The tarball already guarantees a
      # Linux download, so a failed AppImage must not fail the release.
      - name: Build AppImage
        continue-on-error: true
        env:
          ARCH: x86_64
          GTK_THEME: Adwaita
          DEPLOY_GTK_VERSION: 3
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          # appstreamcli quietens (and avoids) the AppStream failure path.
          sudo apt-get install -y appstream || true
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --exclude-library "libwebkit2gtk*" \
            --exclude-library "libjavascriptcoregtk*" \
            --output appimage
          built=$(ls -1 *.AppImage | grep -iv linuxdeploy | head -n1)
          cp "$built" dist/Kopuz-x86_64.AppImage
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            scripts/install-linux.sh
          fail_on_unmatched_files: false

  # ---- Android: sideloadable APK (works on GrapheneOS — no Play Services) -
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@30b5ca8b54e1dcffd9548bc87ede1531310fdc67 # v1.20.0
      - name: Install dioxus-cli + just
        run: cargo binstall dioxus-cli@0.7.9 just -y --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CSS
        run: |
          npm install
          npx @tailwindcss/cli -i ./tailwind.css -o ./crates/kopuz/assets/tailwind.css
      - name: Build + patch APK
        run: just android-patch
      - name: Stage APK
        run: |
          mkdir -p dist
          find target/dx/kopuz/release/android -name "*.apk" -exec cp {} dist/Kopuz-android.apk \;
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kopuz-android.apk
          fail_on_unmatched_files: false

  # NOTE: iOS is intentionally not built here. Upstream Kopuz has no iOS
  # support — its mobile code paths are Android-specific (JNI permissions,
  # Android music-dir detection) with no iOS equivalents, and rfd's file
  # dialogs don't build for iOS. Producing a working .ipa needs a dedicated
  # iOS port. The `just ios-ipa-*` recipes remain for anyone who wants to
  # take that on.
