name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  locale-parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check locale parity against en.ftl
        run: nix shell nixpkgs#nushell --command nu scripts/check_locales.nu

      - name: Check Rust i18n usage against en.ftl
        run: nix shell nixpkgs#nushell --command nu scripts/check_i18n_usage.nu

  pr-build:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Run Nix checks
        run: nix build .#checks.${{ matrix.system }}.default

  push-build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v14
        with:
          name: kopuz
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Nix package
        run: nix build .#packages.${{ matrix.system }}.default

      - name: Push result to Cachix
        run: cachix push kopuz result

  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@30b5ca8b54e1dcffd9548bc87ede1531310fdc67 # v1.20.0

      - name: Install dioxus-cli
        # Token lets binstall query the GitHub API for the prebuilt release
        # asset without hitting the 60-req/hr unauthenticated limit. Disable the
        # compile fallback so a missed prebuilt fails fast instead of building
        # dioxus-cli from source (which breaks on auth-git2/git2 0.21).
        #
        # --force: the rust-cache can restore a "dx already installed" marker
        # without a usable binary, and the next step then dies with "the term
        # 'dx' is not recognized". release.yml already carries both this and the
        # PATH line below; this job was missing them and failed intermittently.
        run: cargo binstall dioxus-cli@0.7.9 -y --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add cargo bin to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"

      # Builds the app, NOT an installer. The NSIS/MSI bundle used to be built
      # and uploaded here, but running that installer over an existing
      # installation wiped a user's %APPDATA% config — session, playlists,
      # favourites. It is no longer published in releases, so it must not be
      # downloadable from CI either. Building the portable app is also the
      # honest Windows compile check: it is exactly what the release ships.
      - name: Build app
        run: dx build --release --platform desktop --package kopuz

      - name: Portable zip
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $app = "target/dx/kopuz/release/windows/app"
          if (Test-Path $app) {
            Compress-Archive -Path "$app/*" -DestinationPath dist/Kopuz-windows-portable.zip -Force
          }
          Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload portable build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kopuz-windows-portable
          path: dist/Kopuz-windows-portable.zip
          if-no-files-found: warn
