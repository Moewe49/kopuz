[package]
name = "server"
version.workspace = true
edition = "2024"

[dependencies]
directories = { workspace = true }
jellyfin-sdk-rust = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
md5 = "0.8"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = { workspace = true }
httpdate = "1"
hex = "0.4"
web-time = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "rt", "sync"] }
reader = { workspace = true }

# rookie's Chromium cookie decryption (the `get_keys` path) doesn't compile
# for android/ios, and browser-based sign-in is desktop-only anyway. Mobile
# uses the manual cookie-paste flow instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rookie = "0.5"

[[example]]
name = "duration_probe"
path = "examples/duration_probe.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
