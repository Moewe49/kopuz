[package]
name = "embed"
version = "0.1.0"
edition = "2024"

# Deliberately not a dependency of the app. The ONNX runtime is a native
# library with a per-platform build, and the Android build cannot be compiled
# or tested locally — so this crate stays out of that path until it is wired in
# behind a desktop-only target gate.

[features]
default = ["onnx"]
# The native ONNX runtime. Everything else in this crate — the mel
# spectrogram, the pooling, the hash check — builds and tests without it, so
# a consumer that only needs the preprocessing does not pay for the runtime.
onnx = ["dep:ort"]

[dependencies]
realfft = "3.5"
# Already compiled into every native target for playback, so decoding here
# costs nothing new — and removes the ffmpeg requirement, which `deps.rs` only
# manages on Windows and macOS.
symphonia = { workspace = true }
# YouTube serves Opus in WebM, and symphonia's bundled codecs refuse it —
# measured: "unsupported audio codec". The player carries the same adapter for
# the same reason.
symphonia-adapter-libopus = "0.3"
ort = { version = "2.0.0-rc.13", optional = true }

# Examples only. Dev-dependencies are never built for a package that merely
# depends on this crate, so nothing here can reach the app or the Android
# target — which is the whole reason the end-to-end tool lives in this crate
# rather than in `server`.
[dev-dependencies]
server = { workspace = true }
reader = { workspace = true }
scrobble = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json = { workspace = true }
