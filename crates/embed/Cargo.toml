[package]
name = "embed"
version = "0.1.0"
edition = "2024"

# Deliberately not a dependency of the app. The ONNX runtime is a native
# library with a per-platform build, and the Android build cannot be compiled
# or tested locally — so this crate stays out of that path until it is wired in
# behind a desktop-only target gate.

[features]
default = ["onnx", "job"]
# The native ONNX runtime. Everything else in this crate — the mel
# spectrogram, the pooling, the hash check — builds and tests without it, so
# a consumer that only needs the preprocessing does not pay for the runtime.
onnx = ["dep:ort"]
# The background analysis job: resolving streams, fetching ranges and keeping
# the vector store. Separate from `onnx` so a consumer that only wants the
# preprocessing does not pull the whole app stack in with it.
job = ["dep:server", "dep:reader", "dep:utils", "dep:tokio", "dep:tracing", "dep:serde_json"]

[dependencies]
realfft = "3.5"
# Already compiled into every native target for playback, so decoding here
# costs nothing new — and removes the ffmpeg requirement, which `deps.rs` only
# manages on Windows and macOS.
symphonia = { workspace = true }
# YouTube serves Opus in WebM, and symphonia's bundled codecs refuse it —
# measured: "unsupported audio codec". The player carries the same adapter for
# the same reason.
symphonia-adapter-libopus = "0.3"
# `load-dynamic`, not the default static link. Measured: linking ONNX Runtime
# adds 17.6 MB to a binary (3.8 -> 21.4 MB on the same example), which would
# take the app from 26.7 MB to about 44 MB — and the in-app updater downloads
# the whole archive on every release. The model is already a runtime download
# because its licence forbids bundling, and recommendations are opt-in, so the
# runtime rides along with it. A listener who never turns the feature on pays
# nothing, and the build needs no network.
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "std", "ndarray"] }

# Examples only. Dev-dependencies are never built for a package that merely
# depends on this crate, so nothing here can reach the app or the Android
# target — which is the whole reason the end-to-end tool lives in this crate
# rather than in `server`.
server = { workspace = true, optional = true }
reader = { workspace = true, optional = true }
utils = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "time"] }
tracing = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Examples only.
[dev-dependencies]
directories = { workspace = true }
scrobble = { workspace = true }
reqwest = { workspace = true }
