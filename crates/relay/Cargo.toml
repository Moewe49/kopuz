[package]
name = "relay"
version = "0.1.0"
edition = "2024"

[features]
default = ["client"]
# Talking to a relay. Everything a device needs, and nothing that would drag a
# web server into the app's dependency graph.
client = ["dep:reqwest"]
# Being a relay. Only the standalone binary turns this on.
server = ["dep:axum", "dep:tokio", "dep:rand"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
reqwest = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "signal"] }
# Server only: unguessable session ids and join codes. A device never pulls this.
rand = { workspace = true, optional = true }

# The end-to-end test needs both halves at once. Depending on this very package
# is the way to say so: without it `cargo test` compiles the test out through
# its own cfg gate and reports success for something it never ran, which is the
# worst of the three possible outcomes.
[dev-dependencies]
relay = { path = ".", features = ["client", "server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"

# Only built when the server feature is on, so a device never compiles axum.
[[bin]]
name = "kopuz-relay"
path = "src/bin/kopuz-relay.rs"
required-features = ["server"]
